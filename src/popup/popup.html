<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Hindsight</title>
    <link rel="icon" type="image/png" href="/icons/icon48.png" />
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <div class="brand">
          <svg class="brand-icon" viewBox="0 0 128 128" width="18" height="18" aria-hidden="true">
            <path
              d="M 8 64 Q 64 12 120 64 Q 64 116 8 64 Z"
              fill="#f1eee3"
              stroke="#15161a"
              stroke-width="3.5"
              stroke-linejoin="round"
            />
            <circle cx="64" cy="64" r="20" fill="#15161a" />
            <circle cx="64" cy="64" r="9" fill="#e53935" />
          </svg>
          <span class="brand-name">Hindsight</span>
        </div>
        <span id="tab-host" class="tab-host hidden"></span>
        <div id="recording-banner" class="recording-banner hidden" role="status">
          <span class="recording-dot" aria-hidden="true"></span>
          <span class="recording-label"
            ><span data-i18n="popup.recording.short">Rec</span>
            <span id="recording-time">00:00</span></span
          >
          <button id="recording-stop" class="ghost-stop" data-i18n="popup.recording.stopShort">
            Stop
          </button>
        </div>
      </header>

      <main>
        <div id="summary" class="summary">
          <button
            id="summary-counts"
            class="counts-button"
            type="button"
            data-i18n-attr="title:popup.summary.title.openFiltered"
          >
            <span class="count-total">
              <strong>0</strong>
              <span data-i18n="popup.summary.eventsLabel">events</span>
            </span>
            <span class="count-errors hidden"></span>
          </button>
        </div>

        <div class="actions">
          <button id="download-bundle" class="primary capture" type="button" disabled>
            <svg
              class="icon"
              viewBox="0 0 24 24"
              width="18"
              height="18"
              fill="none"
              stroke="currentColor"
              stroke-width="1.75"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <circle cx="12" cy="12" r="9" />
              <path d="M12 7v5l3 2" />
            </svg>
            <span class="capture-text">
              <span id="capture-label" data-i18n="popup.actions.captureMoment"
                >Capture last moment</span
              >
              <span class="capture-sub" data-i18n="popup.actions.captureMoment.sub"
                >Replay file · created on this device</span
              >
            </span>
          </button>
          <button id="open-panel" class="secondary" type="button">
            <svg
              class="icon"
              viewBox="0 0 24 24"
              width="16"
              height="16"
              fill="none"
              stroke="currentColor"
              stroke-width="1.75"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <rect x="3" y="4" width="18" height="16" rx="2" />
              <path d="M15 4v16" />
            </svg>
            <span data-i18n="popup.actions.openPanel">Open side panel</span>
            <kbd id="open-panel-key" class="kbd hidden"></kbd>
          </button>
        </div>

        <section id="failures" class="failures hidden" aria-labelledby="failures-heading">
          <h2 id="failures-heading" class="section-title" data-i18n="popup.failures.heading">
            Recent failures
          </h2>
          <div id="failure-list" class="failure-list" role="list"></div>
        </section>

        <div class="page-controls">
          <button
            id="reload-page"
            class="secondary"
            type="button"
            data-i18n="popup.page.reload"
            data-i18n-attr="title:popup.page.reload.title"
          >
            Reload
          </button>
          <button
            id="reload-hard"
            class="secondary"
            type="button"
            data-i18n="popup.page.hardReload"
            data-i18n-attr="title:popup.page.hardReload.title"
          >
            Hard reload
          </button>
          <button
            id="clear-events"
            class="secondary danger-btn"
            type="button"
            data-i18n-attr="title:popup.page.clearHistory.title"
          >
            <svg
              class="icon"
              viewBox="0 0 24 24"
              width="14"
              height="14"
              fill="none"
              stroke="currentColor"
              stroke-width="1.75"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path
                d="M4 7h16M10 11v6M14 11v6M6 7l1 13a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-13M9 7V4h6v3"
              />
            </svg>
            <span data-i18n="popup.page.clearHistory">Clear history</span>
          </button>
        </div>

        <div id="quick-share" class="quick-share hidden">
          <div class="quick-share-label" data-i18n="popup.share.label">Send to</div>
          <div class="quick-share-buttons" id="quick-share-buttons"></div>
        </div>
      </main>

      <footer class="popup-footer">
        <span id="privacy-note" class="privacy-note">
          <svg
            class="icon"
            viewBox="0 0 24 24"
            width="14"
            height="14"
            fill="none"
            stroke="currentColor"
            stroke-width="1.75"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M12 3 4 6v6c0 5 3.4 8.3 8 9 4.6-.7 8-4 8-9V6l-8-3Z" />
          </svg>
          <span id="privacy-text" data-i18n="popup.footer.local">Data stays on this device</span>
        </span>
        <a id="open-settings" href="#" data-i18n="popup.footer.settings">Settings</a>
      </footer>
    </div>
    <script type="module" src="./popup.ts"></script>
  </body>
</html>
